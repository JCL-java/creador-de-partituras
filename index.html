<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Anotaciones Musicales - Multipágina</title>
    <!-- Librerías para captura de pantalla, procesamiento PDF y metadatos -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link rel="manifest" href="manifest.json">

    <style>
        /* --- ESTILOS GENERALES Y FONDO --- */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        html, body { background-color: #0b0f19; color: #ffffff; display: flex; height: 100vh; width: 100vw; overflow: hidden; }

        /* --- BARRA LATERAL (SIDEBAR) --- */
        .sidebar { 
    width: 320px; /* Ensanchado a 320px para que entren las hojas */
    min-width: 320px; 
    max-width: 320px; 
    background-color: #111827; 
    border-right: 1px solid #1f2937; 
    padding: 14px; 
    display: flex; 
    flex-direction: column; 
    gap: 14px; 
    overflow-y: auto; 
    z-index: 10; 
    box-sizing: border-box;
}

.sidebar h3 { 
    font-size: 0.75rem; 
    color: #6b7280; 
    text-transform: uppercase; 
    letter-spacing: 1px; 
    margin-bottom: 8px; 
}

.palette-group { 
    display: grid; 
    grid-template-columns: repeat(4, 1fr); 
    gap: 6px; /* Espaciado compacto entre botones */
}

        /* --- NAVEGACIÓN DE HOJAS DE TRABAJO --- */
        .pages-control-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #1f2937;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #374151;
        }
        .pages-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr); /* Crea exactamente 4 columnas */
    gap: 6px;
    width: 100%;
    overflow-x: hidden;
    overflow-y: auto;
    max-height: 180px;
    padding-bottom: 4px;
}

.page-tab-btn {
    background-color: #111827;
    color: #9ca3af;
    border: 1px solid #374151;
    padding: 8px 4px;
    border-radius: 6px;
    font-weight: bold;
    font-size: 0.85rem;
    cursor: pointer;
    text-align: center;
    width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
        .page-tab-btn.active {
            background-color: #2563eb;
            color: #ffffff;
            border-color: #3b82f6;
        }
        .page-actions-row {
            display: flex;
            gap: 8px;
        }
        .custom-modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(3px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
}

.custom-modal-overlay.active {
    display: flex;
}

.custom-modal-box {
    background: #111827;
    border: 1px solid #374151;
    border-radius: 12px;
    padding: 24px;
    width: 340px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    text-align: center;
}

.custom-modal-box p {
    color: #ffffff;
    font-size: 0.95rem;
    margin-bottom: 20px;
    line-height: 1.4;
}

.custom-modal-actions {
    display: flex;
    gap: 10px;
}

.custom-modal-actions button {
    flex: 1;
    padding: 10px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    border: none;
    font-size: 0.85rem;
}

.btn-modal-cancel {
    background: #374151;
    color: #ffffff;
}

.btn-modal-cancel:hover {
    background: #4b5563;
}

.btn-modal-ok {
    background: #991b1b;
    color: #ffffff;
}

.btn-modal-ok:hover {
    background: #b91c1c;
}


        .page-action-btn {
            flex: 1;
            background-color: #374151;
            color: #ffffff;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .page-action-btn:hover { background-color: #4b5563; }
        .page-action-btn.btn-delete-page { background-color: #7f1d1d; }
        .page-action-btn.btn-delete-page:hover { background-color: #991b1b; }

        /* --- BOTONES DE LA PALETA --- */
        .symbol-btn { 
    background-color: #1f2937; 
    color: #f3f4f6; 
    border: 1px solid #374151; 
    padding: 6px 2px; /* Relleno ajustado */
    height: 38px; /* Alto fijo rígido */
    min-height: 38px;
    border-radius: 6px; 
    font-weight: bold; 
    font-size: 0.95rem; 
    cursor: pointer; 
    text-align: center; 
    user-select: none; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
}
        .symbol-btn:hover { background-color: #2563eb; border-color: #3b82f6; }
        .symbol-btn.btn-delete { background-color: #22106C !important; border-color: #311c8a !important; }
        .symbol-btn.btn-delete:hover { background-color: #2d168f !important; }
        .symbol-btn.btn-large-symbol { font-size: 1.6rem !important; font-weight: 700; }

        /* --- BOTONES DE ACCIÓN --- */
        .danger-btn { background-color: #991b1b; color: white; border: 1px solid #b91c1c; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%; }
        .danger-btn:hover { background-color: #7f1d1d; }
        .export-btn { background-color: #059669; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
        .export-btn:hover { background-color: #047857; }
        .import-btn { background-color: #2563eb; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
        .import-btn:hover { background-color: #1d4ed8; }

        /* --- CONTENEDOR PRINCIPAL Y LIENZO --- */
        .main-content { flex: 1; padding: 20px; background-color: #0b0f19; overflow: auto; display: flex; justify-content: center; align-items: center; height: 100vh; box-sizing: border-box; }
        .paper { background-color: #000000 !important; color: #ffffff; width: 100%; max-width: 1400px; aspect-ratio: 297 / 210; padding: 20px 45px 25px 45px; border: 2px solid #1e293b; border-radius: 4px; display: flex; flex-direction: column; box-sizing: border-box; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); overflow: hidden; }

        .sheet-title { 
    text-align: center; 
    font-size: 2.0rem; 
    font-weight: 900; 
    outline: none; 
    margin-bottom: 8px; 
    text-transform: uppercase; /* <-- FORZAR MAYÚSCULAS VISUALES */
    color: #FFFFFF; 
    letter-spacing: 1px; 
    line-height: 1; 
}

        /* --- FILAS Y CELDAS --- */
        .rows-container { display: flex; flex-direction: column; justify-content: flex-start; gap: 20px; flex: 1; overflow: hidden; margin-top: 5px; }
        .sheet-row { display: flex; align-items: center; width: 100%; height: 36px; gap: 8px; position: relative; }
        .row-label { 
    width: 130px; 
    min-width: 130px; 
    max-width: 130px; 
    font-weight: 700; 
    font-size: 1.4rem; 
    outline: none; 
    border-bottom: none; 
    padding-right: 4px; 
    color: inherit; 
    white-space: pre-wrap !important; 
    word-break: break-word !important; 
    line-height: 1.2 !important; 
    height: auto !important;          /* Permite crecer verticalmente */
    display: block !important;         /* Fuerza comportamiento de bloque */
    overflow: visible !important;
}
        .row-label:focus { background-color: #1f2937; outline: none; }
        .row-cells { display: grid; grid-template-columns: repeat(32, minmax(0, 1fr)); align-items: center; flex: 1; height: 100%; gap: 4px; margin-left: 10px; }

        .cell { height: 100%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.6rem; line-height: 1; letter-spacing: -0.5px; cursor: pointer; user-select: none; position: relative; color: inherit; white-space: nowrap; overflow: visible; border-bottom: none; text-align: center; }
        .cell.multi-selected { background-color: rgba(37, 99, 235, 0.45) !important; outline: 1px dashed #60a5fa; }
        .cell.selected::after { content: ''; position: absolute; bottom: 1px; left: 0; width: 100%; height: 3px; background-color: #FF0000; animation: blink-cursor 1s step-end infinite; }
        @keyframes blink-cursor { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        
        .cell svg circle, .cell svg rect, .cell svg line, .cell svg polyline { fill: none; stroke: currentColor; }
        .cell.is-repeat svg circle { fill: currentColor !important; }
        .cell.is-pause svg path { fill: #FF0000 !important; stroke: none; fill-rule: evenodd; }
        .cell.is-pause svg { display: block; margin: 0 auto; }

        .cell.is-arrow, .cell.is-left-arrow-container, .cell.is-power, .cell.is-pause, .cell.is-slash, .cell.is-quarter-note { color: #FF0000 !important; }
        .cell.is-arrow svg *, .cell.is-left-arrow-container svg *, .cell.is-quarter-note svg * { stroke: #FF0000 !important; fill: none; }
        .cell.is-left-arrow-container .arrow-subnum, .cell.is-power .power-num { color: #FF0000 !important; }

        .cell.is-arrow { display: flex !important; align-items: center !important; justify-content: center !important; }
        .cell.is-arrow svg.arrow-svg { width: 30px !important; height: 30px !important; display: block !important; }

        .cell.is-only-start-bracket, .cell.is-only-end-bracket { display: flex; align-items: center; justify-content: center; }
        .cell.is-only-start-bracket svg, .cell.is-only-end-bracket svg { display: block; }

        .cell .bar-char { font-size: 2.0rem; font-weight: 700; margin: 0; line-height: 1; }
        .cell.is-bar, .cell.is-slash { font-size: 2.0rem !important; font-weight: 700 !important; }

        .cell.is-power { position: relative; }
        .cell.is-power .power-num { position: absolute; top: 0px; left: 5px; font-size: 1.4rem; font-weight: 900; line-height: 1; }
        .cell.is-left-arrow-container { display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
        .cell.is-left-arrow-container .arrow-subnum { font-size: 1.1rem; font-weight: 900; margin-top: -3px; }

        .color-select { width: 100%; background-color: #1f2937; color: #ffffff; border: 1px solid #374151; padding: 12px; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; outline: none; }
        .color-select option { background-color: #111827; color: #ffffff; }
    </style>
</head>
<body>

    <div class="sidebar">    
        <div>
            <h3>Acordes</h3>
            <div class="palette-group">
                <button class="symbol-btn" onclick="insertSymbol('C')">C</button>
                <button class="symbol-btn" onclick="insertSymbol('Cm')">Cm</button>
                <button class="symbol-btn" onclick="insertSymbol('C#')">C#</button>
                <button class="symbol-btn" onclick="insertSymbol('C#m')">C#m</button>
                <button class="symbol-btn" onclick="insertSymbol('D')">D</button>
                <button class="symbol-btn" onclick="insertSymbol('Dm')">Dm</button>
                <button class="symbol-btn" onclick="insertSymbol('D#')">D#</button>
                <button class="symbol-btn" onclick="insertSymbol('D#m')">D#m</button>
                <button class="symbol-btn" onclick="insertSymbol('F')">F</button>
                <button class="symbol-btn" onclick="insertSymbol('Fm')">Fm</button>
                <button class="symbol-btn" onclick="insertSymbol('F#')">F#</button>
                <button class="symbol-btn" onclick="insertSymbol('F#m')">F#m</button>
                <button class="symbol-btn" onclick="insertSymbol('G')">G</button>
                <button class="symbol-btn" onclick="insertSymbol('Gm')">Gm</button>
                <button class="symbol-btn" onclick="insertSymbol('G#')">G#</button>
                <button class="symbol-btn" onclick="insertSymbol('G#m')">G#m</button>
                <button class="symbol-btn" onclick="insertSymbol('A')">A</button>
                <button class="symbol-btn" onclick="insertSymbol('Am')">Am</button>
                <button class="symbol-btn" onclick="insertSymbol('A#')">A#</button>
                <button class="symbol-btn" onclick="insertSymbol('A#m')">A#m</button>
                <button class="symbol-btn" onclick="insertSymbol('E')">E</button>
                <button class="symbol-btn" onclick="insertSymbol('Em')">Em</button>
                <button class="symbol-btn" onclick="insertSymbol('B')">B</button>
                <button class="symbol-btn" onclick="insertSymbol('Bm')">Bm</button>
            </div>
        </div>

        <div>
            <h3>Símbolos Especiales</h3>
            <div class="palette-group">
                <button class="symbol-btn" title="Corchete Izquierdo" onclick="insertSpecial('only-start-bracket')">
                    <svg width="12" height="28" viewBox="0 0 14 38" fill="none"><path d="M12 2H2V36H12" stroke="currentColor" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/></svg>
                </button>
                <button class="symbol-btn" title="Corchete Derecho" onclick="insertSpecial('only-end-bracket')">
                    <svg width="12" height="28" viewBox="0 0 14 38" fill="none"><path d="M2 2H12V36H2" stroke="currentColor" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/></svg>
                </button>
                <button class="symbol-btn btn-large-symbol" onclick="insertSymbol('|')">|</button>
                <button class="symbol-btn btn-delete" title="Borrar (Backspace)" onclick="handleDeleteButton()">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
                        <line x1="18" y1="9" x2="12" y2="15"></line>
                        <line x1="12" y1="9" x2="18" y2="15"></line>
                    </svg>
                </button>
                
                <button class="symbol-btn" title="Pausa / Redonda" onclick="insertSymbol('pausa')">
                    <svg width="38" height="26" viewBox="0 0 100 70"><path fill="#FF0000" fill-rule="evenodd" d="M 50 0 C 77.6 0 100 15.7 100 35 C 100 54.3 77.6 70 50 70 C 22.4 70 0 54.3 0 35 C 0 15.7 22.4 0 50 0 Z M 50 11 C 41.5 11 36 21 36 35 C 36 49 41.5 59 50 59 C 58.5 59 64 49 64 35 C 64 21 58.5 11 50 11 Z" transform="rotate(-18 50 35)"/></svg>
                </button>
                <button class="symbol-btn" title="Nota Negra" onclick="insertSymbol('negra')">
                    <svg width="32" height="32" viewBox="0 0 24 24">
                        <circle cx="9" cy="17" r="5" fill="#FF0000" stroke="#FF0000" stroke-width="1"/>
                        <line x1="13.5" y1="17" x2="13.5" y2="3" stroke="#FF0000" stroke-width="3.5" stroke-linecap="round"/>
                    </svg>
                </button>
                <button class="symbol-btn" onclick="insertSymbol('%')">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <circle cx="6.5" cy="7.5" r="3.5" fill="currentColor"/>
                        <circle cx="17.5" cy="16.5" r="3.5" fill="currentColor"/>
                        <line x1="4" y1="21" x2="20" y2="3" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                    </svg>
                </button>
                <button class="symbol-btn" title="Repetición + Barra" onclick="insertRepeatBar()">
                    <svg width="28" height="22" viewBox="0 0 28 22" style="display: block;">
                        <circle cx="5" cy="6" r="2.8" fill="currentColor"/>
                        <circle cx="13" cy="16" r="2.8" fill="currentColor"/>
                        <line x1="3" y1="19" x2="15" y2="3" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                        <line x1="23" y1="2" x2="23" y2="20" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
                    </svg>
                </button>

                <button class="symbol-btn btn-large-symbol" style="color: #FF0000;" onclick="insertSymbol('/')">/</button>
                <button class="symbol-btn" title="Flecha Izquierda" onclick="insertSymbol('←')">
                    <svg width="22" height="22" viewBox="0 0 24 24">
                        <line x1="20" y1="12" x2="4" y2="12" stroke="#FF0000" stroke-width="4" stroke-linecap="round"/>
                        <polyline points="11,5 4,12 11,19" fill="none" stroke="#FF0000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <button class="symbol-btn" title="Flecha Arriba" onclick="insertSymbol('↑')">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <line x1="12" y1="22" x2="12" y2="4" stroke="#FF0000" stroke-width="4" stroke-linecap="round"/>
                        <polyline points="5,11 12,4 19,11" fill="none" stroke="#FF0000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <button class="symbol-btn" style="color: #FF0000;" onclick="insertSymbol('x2', true)">x2</button>
                
                <button class="symbol-btn" style="color: #FF0000;" onclick="insertSymbol('x3', true)">x3</button>
                <button class="symbol-btn" style="color: #FF0000;" onclick="insertSymbol('x4', true)">x4</button>
                <button class="symbol-btn" style="color: #FF0000;" onclick="insertSymbol('x5', true)">x5</button>
                <button class="symbol-btn" style="color: #FF0000;" onclick="insertSymbol('x6', true)">x6</button>
                
                <button class="symbol-btn" style="color: #FF0000;" onclick="insertSymbol('x7', true)">x7</button>
                <button class="symbol-btn" style="color: #FF0000;" onclick="insertSymbol('x8', true)">x8</button>
                <button class="symbol-btn" style="color: #FF0000;" onclick="insertSymbol('x9', true)">x9</button>
                <button class="symbol-btn" style="background-color: #991b1b; color: white;" onclick="applyRedToSelected()">Rojo</button>
            </div>
        </div>
        <div>
            <h3>Hojas de Trabajo</h3>
            <div class="pages-control-container">
                <div class="pages-bar" id="pagesBar"></div>
                <div class="page-actions-row">
                    <button class="page-action-btn" onclick="addNewPage()">➕ Nueva Hoja</button>
                    <button class="page-action-btn btn-delete-page" onclick="deleteCurrentPage()">🗑️ Eliminar</button>
                </div>
            </div>
        </div>

        <div>
            <h3>Color de Texto (Fila Activa)</h3>
            <button class="page-action-btn" style="background-color: #28831A; width: 100%; padding: 12px; font-size: 1rem;" onclick="toggleActiveRowColor()">
                🟢 Fila Verde / Blanco
            </button>
        </div>

        <div>
            <button class="danger-btn" onclick="clearAllCells()"> 🧹 Limpiar Lienzo </button>
        </div>

        <button class="export-btn" onclick="exportToPDF()">📄 Descargar PDF</button>

        <div style="margin-top: 10px;">
            <input type="file" id="pdfFileInput" accept=".pdf" style="display: none;" onchange="importPDFWithMetadata(event)">
            <label for="pdfFileInput" class="import-btn" style="width: 100%;">📂 Abrir PDF</label>
        </div>
    </div>

    <div class="main-content">
        <div class="paper" id="sheetPaper">
            <div class="sheet-title" id="sheetTitle" contenteditable="true"></div>
            <div class="rows-container" id="rowsContainer"></div>
        </div>
    </div>

    <script>
// --- CONFIGURACIÓN DE LIBRERÍAS DE TERCEROS ---
// Define la ruta del proceso en segundo plano (worker) para procesar archivos PDF con PDF.js
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// --- VARIABLES GLOBALES DE ESTADO Y SELECCIÓN ---
let selectedCell = null;        // Almacena la celda (DOM Element) actualmente enfocada
let selectionStart = null;      // Guarda las coordenadas {row, col} donde se inicia el arrastre del ratón
let isMouseDown = false;        // Bandera (true/false) para saber si el botón del ratón está presionado
let selectedCellsList = [];     // Lista de celdas seleccionadas cuando se hace una selección múltiple
let clipboardData = null;       // Matriz con datos copiados temporalmente para funciones Cortar/Copiar/Pegar

// --- VARIABLES PARA EL CONTROL DE DESHACER (CONTROL + Z) ---
let undoStack = [];             // Historial de capturas de la partitura
const maxUndoSteps = 50;        // Límite máximo de pasos para la función deshacer

// --- CONFIGURACIÓN DE LA CUADRÍCULA ---
const defaultLabels = ["", "", "", "", "", "", "", "", "", "", "", "", "", "", "", ""]; // Nombres iniciales de las filas
const maxCols = 31;             // Total de columnas por fila (0 a 31 = 32 columnas)
const maxRows = 15;             // Total de filas por hoja (0 a 15 = 16 filas)

// --- ESTRUCTURA Y NAVEGACIÓN MULTIPÁGINA ---
let docTitle = "";       // Título global predeterminado para el documento
let activePageIndex = 0;        // Índice de la hoja actual visible en pantalla
let pagesData = [ createEmptyPageObject() ]; // Colección que almacena la información de todas las hojas

// SVG reutilizable para renderizar la flecha hacia arriba
const ARROW_UP_SVG = `<svg class="arrow-svg" viewBox="0 0 24 24"><line x1="12" y1="22" x2="12" y2="4" stroke-width="4" stroke-linecap="round"/><polyline points="5,11 12,4 19,11" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

// --- REFERENCIAS AL DOM ---
const rowsContainer = document.getElementById('rowsContainer'); // Contenedor principal de las filas en la hoja
const sheetTitle = document.getElementById('sheetTitle');       // Elemento HTML con el título de la página
const colorSelect = document.getElementById('textColorSelect');  // Selector/control de colores
const pagesBar = document.getElementById('pagesBar');           // Barra contenedora de pestañas de hojas

/**
 * Genera la estructura de datos para una hoja en blanco.
 * @returns {Object} Objeto con título, etiquetas, colores de fila y lista de celdas vacíos.
 */
function createEmptyPageObject() {
    return { title: "", labels: [...defaultLabels], rowColors: {}, cells: [] };
}

// --- CONSTRUCCIÓN INICIAL DEL LIENZO Y CUADRÍCULA ---
// Genera dinámicamente el HTML de las 16 filas con sus 32 celdas cada una
for (let i = 0; i <= maxRows; i++) { 
    const row = document.createElement('div');
    row.className = 'sheet-row';
    row.dataset.rowIndex = i;

    // Crear la etiqueta/nombre de la fila a la izquierda
    const label = document.createElement('div');
    label.className = 'row-label';
    label.contentEditable = "true";
    label.dataset.rowIndex = i;
    label.textContent = defaultLabels[i] || "";
    label.addEventListener('input', saveState);
    label.addEventListener('click', () => { 
        const firstCell = row.querySelector('.cell'); 
        if (firstCell) selectCell(firstCell); 
    });
    
    row.appendChild(label);

    // Crear el contenedor de celdas cuadradas
    const cellsContainer = document.createElement('div');
    cellsContainer.className = 'row-cells';
    for (let j = 0; j <= maxCols; j++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.row = i;
        cell.dataset.col = j;

        // Escuchadores para la selección por arrastre (clic y mover el cursor)
        cell.addEventListener('mousedown', (e) => { 
            isMouseDown = true; 
            selectionStart = { row: parseInt(cell.dataset.row), col: parseInt(cell.dataset.col) }; 
            selectCell(cell);
        });
        cell.addEventListener('mouseenter', () => { 
            if (isMouseDown && selectionStart) { 
                const current = { row: parseInt(cell.dataset.row), col: parseInt(cell.dataset.col) }; 
                selectCellRange(selectionStart, current); 
            } 
        });
        cellsContainer.appendChild(cell);
    }
    row.appendChild(cellsContainer);
    rowsContainer.appendChild(row);
}

// Evento global para soltar el clic del ratón y finalizar la selección múltiple
document.addEventListener('mouseup', () => { 
    isMouseDown = false; 
    if (selectedCellsList.length <= 1) { 
        clearSelectionStyles(); 
        if (selectedCell) selectedCell.classList.add('selected'); 
    } 
});

// Evento que sincroniza el título ingresado en el lienzo con los datos globales
sheetTitle.addEventListener('input', () => {
    // Usamos textContent directo
    const rawText = sheetTitle.textContent; 
    const fullText = rawText.trim();
    
    if (pagesData[activePageIndex]) {
        pagesData[activePageIndex].title = rawText; // Mantiene minúsculas/mayúsculas exactas
    }
    
    const match = fullText.match(/^(.*?)(?:\s+\d+)?$/);
    if (match && match[1].trim() !== "") {
        docTitle = match[1].trim();
    } else {
        docTitle = fullText;
    }
    
    saveState();
});

/**
 * Muestra una ventana modal personalizada para confirmar una acción (Ej: Eliminar).
 * @param {string} message - El mensaje que se mostrará al usuario.
 * @returns {Promise<boolean>} Devuelve true si el usuario presiona Aceptar, false si Cancelar.
 */
function showCustomConfirm(message) {
    return new Promise((resolve) => {
        const modal = document.getElementById('customConfirmModal');
        const msgEl = document.getElementById('customConfirmMessage');
        const btnOk = document.getElementById('customConfirmBtnOk');
        const btnCancel = document.getElementById('customConfirmBtnCancel');

        msgEl.textContent = message;
        btnCancel.style.display = 'inline-block';
        modal.classList.add('active');

        setTimeout(() => btnOk.focus(), 50);

        const cleanup = () => {
            modal.classList.remove('active');
            btnOk.removeEventListener('click', handleOk);
            btnCancel.removeEventListener('click', handleCancel);
            document.removeEventListener('keydown', handleKeyDown);
        };

        const handleOk = () => { cleanup(); resolve(true); };
        const handleCancel = () => { cleanup(); resolve(false); };

        const handleKeyDown = (e) => {
            if (e.key === 'Enter') { e.preventDefault(); handleOk(); }
            else if (e.key === 'Escape') { e.preventDefault(); handleCancel(); }
        };

        btnOk.addEventListener('click', handleOk);
        btnCancel.addEventListener('click', handleCancel);
        document.addEventListener('keydown', handleKeyDown);
    });
}

// --- GESTIÓN Y RENDERING DE HAPAS/PÁGINAS ---


window.updateHeaderTitle = function() {
  const titleEl = document.getElementById('docTitle') || document.querySelector('.doc-title');
  if (titleEl) {
    if (titleEl.tagName === 'INPUT') titleEl.value = docTitle;
    else titleEl.textContent = docTitle;
  }
};


/**
 * Vuelve a dibujar los botones de las hojas ("Hoja 1", "Hoja 2", etc.) en el panel lateral.
 */
function renderPagesUI() {
    pagesBar.innerHTML = '';
    pagesData.forEach((_, idx) => {
        const btn = document.createElement('button');
        btn.className = `page-tab-btn ${idx === activePageIndex ? 'active' : ''}`;
        btn.textContent = `Hoja ${idx + 1}`;
        btn.onclick = () => switchPage(idx);
        pagesBar.appendChild(btn);
    });

}

/**
 * Actualiza el encabezado del lienzo con el título de la hoja activa.
 */
function updateLabelData(index, element) {
    // Convierte saltos de línea de HTML a \n limpios
    let text = element.innerText || element.textContent;
    labelsData[index] = text;
}

/**
 * Guarda los elementos visuales del DOM de la hoja actual en el objeto JavaScript pagesData.
 * @param {number} pageIndex - Índice de la página a guardar.
 */
function saveCurrentPageToMemory(pageIndex = activePageIndex) {
    if (!pagesData[pageIndex]) return;
    
    pagesData[pageIndex].title = sheetTitle.textContent.trim();
    pagesData[pageIndex].labels = [];
    pagesData[pageIndex].rowColors = {};
    pagesData[pageIndex].cells = [];
    
    document.querySelectorAll('.row-label').forEach(label => pagesData[pageIndex].labels.push(label.textContent));
    document.querySelectorAll('.sheet-row').forEach(row => { 
        if (row.style.color) pagesData[pageIndex].rowColors[row.dataset.rowIndex] = row.style.color; 
    });
    
    document.querySelectorAll('.cell').forEach(cell => {
        if (cell.innerHTML.trim() !== '') {
            pagesData[pageIndex].cells.push({
                row: cell.dataset.row,
                col: cell.dataset.col,
                className: cell.className.replace(/\b(selected|multi-selected)\b/g, '').replace(/\s+/g, ' ').trim(),
                html: cell.innerHTML,
                color: cell.style.color || ''
            });
        }
    });
}

const waitFrame = () => new Promise(resolve => setTimeout(resolve, 150));

/**
 * Lee la memoria y dibuja en el lienzo HTML el contenido correspondiente al índice indicado.
 * @param {number} index - Índice de la página que se desea mostrar.
 */
function loadPageFromMemory(index) {
    if (!pagesData[index]) return;
    
    activePageIndex = index;

    // Limpiar pantalla antes de renderizar
    sheetTitle.textContent = "";
    document.querySelectorAll('.cell').forEach(cell => { 
        cell.className = 'cell'; 
        cell.innerHTML = ''; 
        cell.style.color = ''; 
    });
    document.querySelectorAll('.sheet-row').forEach(r => r.style.color = '');

    const pageObj = pagesData[index];

    // Cargar título y nombres de filas
    sheetTitle.textContent = pageObj.title || "";
    const labelDivs = document.querySelectorAll('.row-label');
    labelDivs.forEach((lDiv, i) => { lDiv.textContent = pageObj.labels[i] || ""; });

    // Cargar colores asignados a las filas
    if (pageObj.rowColors) {
        Object.keys(pageObj.rowColors).forEach(rowIndex => {
            const targetRow = document.querySelector(`.sheet-row[data-row-index="${rowIndex}"]`);
            if (targetRow) targetRow.style.color = pageObj.rowColors[rowIndex];
        });
    }

    // Restaurar los acordes/símbolos de cada celda
    if (pageObj.cells) {
        pageObj.cells.forEach(cData => {
            const cell = document.querySelector(`.cell[data-row="${cData.row}"][data-col="${cData.col}"]`);
            if (cell) {
                let rawClasses = cData.className.split(' ').filter(cls => cls !== 'cell' && cls !== 'selected' && cls !== 'multi-selected');
                let cellContent = cData.html;
                if (cellContent.includes('↑') || cellContent.trim() === '↑' || rawClasses.includes('is-arrow')) {
                    cellContent = ARROW_UP_SVG;
                    if (!rawClasses.includes('is-arrow')) rawClasses.push('is-arrow');
                }
                cell.className = 'cell ' + rawClasses.join(' ');
                cell.innerHTML = cellContent;
                if (cData.color) cell.style.color = cData.color;
            }
        });
    }

    renderPagesUI();
}

/**
 * Cambia la vista de una hoja a otra guardando primero la actual.
 * @param {number} index - Índice de la nueva hoja de destino.
 */
function switchPage(index) {
    if (index === activePageIndex) return;
    saveCurrentPageToMemory(activePageIndex);
    loadPageFromMemory(index);
    saveState();
}

/**
 * Agrega una nueva hoja vacía al final del documento y cambia hacia ella.
 */
function addNewPage() {
    saveCurrentPageToMemory();
    pagesData.push(createEmptyPageObject());
    loadPageFromMemory(pagesData.length - 1);
    saveState();
}

/**
 * Elimina la hoja que se está visualizando actualmente tras pedir confirmación.
 */
async function deleteCurrentPage() {
    if (pagesData.length <= 1) {
        await showCustomAlert("Debe haber al menos una hoja de trabajo.");
        return;
    }
    
    const confirmed = await showCustomConfirm(`¿Eliminar la Hoja ${activePageIndex + 1}?`);
    if (confirmed) {
        pagesData.splice(activePageIndex, 1);
        if (activePageIndex >= pagesData.length) {
            activePageIndex = pagesData.length - 1;
        }
        loadPageFromMemory(activePageIndex);
        saveState();
    }
}

// --- MANEJO DE SELECCIÓN Y CELDAS ---

/**
 * Selecciona una región rectangular de celdas al arrastrar el ratón.
 */
function selectCellRange(start, end) {
    clearSelectionStyles();
    const minRow = Math.min(start.row, end.row), maxRow = Math.max(start.row, end.row);
    const minCol = Math.min(start.col, end.col), maxCol = Math.max(start.col, end.col);
    
    selectedCellsList = [];
    for (let r = minRow; r <= maxRow; r++) { 
        for (let c = minCol; c <= maxCol; c++) { 
            const cell = document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`); 
            if (cell) { 
                cell.classList.add('multi-selected'); 
                selectedCellsList.push(cell); 
            } 
        } 
    }
    const activeCell = document.querySelector(`.cell[data-row="${start.row}"][data-col="${start.col}"]`);
    if (activeCell) { 
        if (selectedCell) selectedCell.classList.remove('selected'); 
        selectedCell = activeCell; 
        selectedCell.classList.add('selected'); 
    }
}

/**
 * Remueve el resaltado azul de selección múltiple en todas las celdas.
 */
function clearSelectionStyles() { 
    document.querySelectorAll('.cell.multi-selected').forEach(c => c.classList.remove('multi-selected')); 
}

/**
 * Marca una celda individual como la celda seleccionada activa.
 * @param {HTMLElement} cell - Elemento HTML correspondiente a la celda.
 */
function selectCell(cell) {
    clearSelectionStyles();
    if (selectedCell) selectedCell.classList.remove('selected');
    selectedCell = cell;
    selectedCell.classList.add('selected');
    selectedCellsList = [cell];
    
    if (colorSelect) {
        const row = selectedCell.closest('.sheet-row');
        if (row) { 
            const computedColor = window.getComputedStyle(row).color; 
            if (computedColor.includes('40, 131, 26') || row.style.color === '#28831A') colorSelect.value = '#28831A'; 
            else colorSelect.value = '#FFFFFF'; 
        }
    }
}

/**
 * Alterna el color del texto de toda la fila activa entre Verde (#28831A) y Blanco (#FFFFFF) mediante el botón[cite: 1].
 */
function toggleActiveRowColor() {
    if (!selectedCell) {
        showCustomAlert("Selecciona una celda en la fila primero.");
        return;
    }

    const targetRow = selectedCell.closest('.sheet-row');
    if (!targetRow) return;

    // Detectar el color actual
    const computedColor = window.getComputedStyle(targetRow).color;
    const isGreen = computedColor.includes('40, 131, 26') || targetRow.style.color === '#28831A' || targetRow.style.color === 'rgb(40, 131, 26)';

    // Cambiar el color
    const newColor = isGreen ? '#FFFFFF' : '#28831A';
    targetRow.style.color = newColor;

    // Mantener los símbolos de color rojo fijo sin sobreescribirlos
    const fixedRedClasses = ['is-arrow', 'is-left-arrow-container', 'is-power', 'is-pause', 'is-slash', 'is-quarter-note'];
    targetRow.querySelectorAll('.cell').forEach(cell => {
        if (!fixedRedClasses.some(cls => cell.classList.contains(cls))) {
            cell.style.color = ''; 
            cell.querySelectorAll('svg *').forEach(el => { el.style.fill = ''; el.style.stroke = ''; });
        }
    });

    saveState();
}

// --- NAVEGACIÓN Y ATAJOS POR TECLADO ---
document.addEventListener('keydown', (e) => {
    if (document.activeElement && document.activeElement.isContentEditable) return;
    
    // Control + Z (Deshacer)
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undoState(); return; }
    if (!selectedCell) return;

    // Copiar, Cortar y Pegar
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') { e.preventDefault(); copySelectedRange(); clearSelectionStyles(); if (selectedCell) selectedCell.classList.add('selected'); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'x') { e.preventDefault(); cutSelectedRange(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v') { e.preventDefault(); pasteSelectedRange(); return; }
    
    // Asignación de subíndice numérico para la flecha izquierda
    if (selectedCell.classList.contains('is-left-arrow-container') && /^[0-9]$/.test(e.key)) { 
        e.preventDefault(); 
        let subNum = selectedCell.querySelector('.arrow-subnum'); 
        if (!subNum) { subNum = document.createElement('span'); subNum.className = 'arrow-subnum'; selectedCell.appendChild(subNum); } 
        subNum.textContent = e.key; 
        saveState(); 
        return; 
    }

    let currentRow = parseInt(selectedCell.dataset.row);
    let currentCol = parseInt(selectedCell.dataset.col);
    let moved = false;
    
    // Teclas de borrado
    if (e.key === 'Backspace') { e.preventDefault(); handleDeleteButton(); return; }
    else if (e.key === 'Delete') { e.preventDefault(); if (selectedCellsList.length > 1) clearSelectedRange(); else clearCell(); return; }
    
    // Flechas del teclado y desplazamiento (Espacio/Enter)
    if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); if (currentCol < maxCols) currentCol++; moved = true; }
    else if (e.key === 'ArrowRight') { e.preventDefault(); if (currentCol < maxCols) currentCol++; moved = true; }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); if (currentCol > 0) currentCol--; moved = true; }
    else if (e.key === 'ArrowDown') { e.preventDefault(); if (currentRow < maxRows) currentRow++; moved = true; }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (currentRow > 0) currentRow--; moved = true; }
    else if (e.key === 'Enter') { e.preventDefault(); if (currentRow < maxRows) { currentRow++; currentCol = 0; } moved = true; }
    
    if (moved) { 
        const nextTarget = document.querySelector(`.cell[data-row="${currentRow}"][data-col="${currentCol}"]`); 
        if (nextTarget) selectCell(nextTarget); 
    }
});

// --- FUNCIONALIDADES DE PORTAPAPELES ---

/**
 * Copia la información HTML y CSS del rango de celdas seleccionado en el portapapeles en memoria.
 */
function copySelectedRange() {
    if (!selectedCellsList.length) return;
    let minRow = Infinity, maxRow = -Infinity, minCol = Infinity, maxCol = -Infinity;
    selectedCellsList.forEach(c => { 
        const r = parseInt(c.dataset.row), col = parseInt(c.dataset.col); 
        if (r < minRow) minRow = r; if (r > maxRow) maxRow = r; 
        if (col < minCol) minCol = col; if (col > maxCol) maxCol = col; 
    });
    const matrix = [];
    for (let r = minRow; r <= maxRow; r++) { 
        const rowArray = []; 
        for (let c = minCol; c <= maxCol; c++) { 
            const cell = document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`); 
            if (cell) { 
                const cleanClass = cell.className.replace('multi-selected', '').replace('selected', '').trim(); 
                rowArray.push({ className: cleanClass === '' ? 'cell' : cleanClass, html: cell.innerHTML }); 
            } 
        } 
        matrix.push(rowArray); 
    }
    clipboardData = matrix;
}

/**
 * Corta la información del rango actual vaciando las celdas de origen.
 */
function cutSelectedRange() {
    if (!selectedCellsList.length && !selectedCell) return;
    copySelectedRange();
    if (selectedCellsList.length > 1) clearSelectedRange(); else clearCell();
}

/**
 * Borra el contenido de todas las celdas resaltadas en la selección múltiple.
 */
function clearSelectedRange() { 
    selectedCellsList.forEach(cell => { cell.className = 'cell'; cell.innerHTML = ''; cell.style.color = ''; }); 
    clearSelectionStyles(); 
    if (selectedCell) selectCell(selectedCell); 
    saveState(); 
}

/**
 * Pega el rango copiado previamente a partir de la celda enfocado.
 */
function pasteSelectedRange() { 
    if (!clipboardData || !selectedCell) return; 
    const startRow = parseInt(selectedCell.dataset.row);
    const startCol = parseInt(selectedCell.dataset.col);
    const numRows = clipboardData.length;
    const numCols = clipboardData[0].length; 
    
    for (let r = 0; r < numRows; r++) { 
        for (let c = 0; c < numCols; c++) { 
            const targetRow = startRow + r, targetCol = startCol + c; 
            if (targetRow <= maxRows && targetCol <= maxCols) { 
                const targetCell = document.querySelector(`.cell[data-row="${targetRow}"][data-col="${targetCol}"]`); 
                if (targetCell) { 
                    const source = clipboardData[r][c]; 
                    targetCell.className = source.className; 
                    targetCell.innerHTML = source.html; 
                } 
            } 
        } 
    } 
    clearSelectionStyles(); 
    selectCell(selectedCell); 
    saveState(); 
}

// --- INSERTAR SÍMBOLOS Y ACORDES ---

/**
 * Inserta corchetes especiales en la celda activa.
 * @param {string} type - 'only-start-bracket' o 'only-end-bracket'
 */
function insertSpecial(type) {
    if (!selectedCell) return;
    selectedCell.className = 'cell selected';
    if (type === 'only-start-bracket') { 
        selectedCell.innerHTML = `<svg width="14" height="38" viewBox="0 0 14 38" fill="none"><path d="M12 2H2V36H12" stroke="currentColor" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="miter"/></svg>`; 
        selectedCell.classList.add('is-only-start-bracket'); 
    } else if (type === 'only-end-bracket') { 
        selectedCell.innerHTML = `<svg width="14" height="38" viewBox="0 0 14 38" fill="none"><path d="M2 2H12V36H2" stroke="currentColor" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="miter"/></svg>`; 
        selectedCell.classList.add('is-only-end-bracket'); 
    }
    saveState(); 
    moveToNext();
}

/**
 * Inserta texto de acordes o elementos SVG (flechas, pausas, notas) en la celda activa.
 * @param {string} symbol - Texto o identificador del símbolo.
 * @param {boolean} isPower - Bandera si es un superíndice (ej: x2, x3).
 */
function insertSymbol(symbol, isPower = false) {
    if (!selectedCell) return;
    selectedCell.className = 'cell selected';
    if (isPower) {
        selectedCell.innerHTML = `<span class="power-num">${symbol}</span>`;
        selectedCell.classList.add('is-power');
    } else if (symbol === '%') {
        selectedCell.innerHTML = `<svg class="repeat-svg" width="30" height="30" viewBox="0 0 24 24"><circle cx="6.5" cy="7.5" r="3.5" fill="currentColor"/><circle cx="17.5" cy="16.5" r="3.5" fill="currentColor"/><line x1="4" y1="21" x2="20" y2="3" stroke-width="4" stroke-linecap="round"/></svg>`;
        selectedCell.classList.add('is-repeat');
    } else if (symbol === 'pausa') {
        selectedCell.innerHTML = `<svg class="pause-svg" width="46" height="32" viewBox="0 0 100 70"><path fill="#FF0000" fill-rule="evenodd" d="M 50 0 C 77.6 0 100 15.7 100 35 C 100 54.3 77.6 70 50 70 C 22.4 70 0 54.3 0 35 C 0 15.7 22.4 0 50 0 Z M 50 11 C 41.5 11 36 21 36 35 C 36 49 41.5 59 50 59 C 58.5 59 64 49 64 35 C 64 21 58.5 11 50 11 Z" transform="rotate(-18 50 35)"/></svg>`;
        selectedCell.classList.add('is-pause');
    } else if (symbol === '↑') {
        selectedCell.innerHTML = ARROW_UP_SVG;
        selectedCell.classList.add('is-arrow');
    } else if (symbol === 'negra') {
        selectedCell.innerHTML = `<svg width="32" height="32" viewBox="0 0 24 24"><circle cx="9" cy="17" r="5" fill="#FF0000" style="fill: #FF0000 !important;"/><line x1="13.5" y1="17" x2="13.5" y2="3" stroke="#FF0000" stroke-width="3.5" stroke-linecap="round"/></svg>`;
        selectedCell.classList.add('is-quarter-note');
    } else if (symbol === '←') {
        selectedCell.innerHTML = `<svg class="arrow-svg" width="28" height="24" viewBox="0 0 24 24"><line x1="20" y1="12" x2="4" y2="12" stroke-width="4" stroke-linecap="round"/><polyline points="11,5 4,12 11,19" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="arrow-subnum"></span>`;
        selectedCell.classList.add('is-left-arrow-container');
    } else {
        selectedCell.textContent = symbol;
        if (symbol.length >= 3) selectedCell.classList.add('is-long-chord');
        if (symbol === '|') selectedCell.classList.add('is-bar');
        if (symbol === '/') selectedCell.classList.add('is-slash');
    }
    if (symbol !== '←') moveToNext();
    saveState();
}

/**
 * Inserta un símbolo de repetición seguido automáticamente por una barra de compás '|' en la celda siguiente.
 */
function insertRepeatBar() {
    if (!selectedCell) return;
    selectedCell.className = 'cell selected';
    selectedCell.innerHTML = `<svg class="repeat-svg" width="30" height="30" viewBox="0 0 24 24"><circle cx="6.5" cy="7.5" r="3.5" fill="currentColor"/><circle cx="17.5" cy="16.5" r="3.5" fill="currentColor"/><line x1="4" y1="21" x2="20" y2="3" stroke-width="4" stroke-linecap="round"/></svg>`;
    selectedCell.classList.add('is-repeat');
    
    const nextCell = selectedCell.nextElementSibling;
    if (nextCell) {
        selectCell(nextCell);
        selectedCell.className = 'cell selected';
        selectedCell.textContent = '|';
        selectedCell.classList.add('is-bar');
        moveToNext();
    }
    saveState();
}

/**
 * Borra el contenido y estilos de una celda en específico.
 */
function clearCell(cell = selectedCell) {
    if (!cell) return;
    cell.innerHTML = '';
    cell.style.color = '';
    const isSelected = cell === selectedCell;
    cell.className = isSelected ? 'cell selected' : 'cell';
    saveState();
}

/**
 * Limpia totalmente todas las celdas, nombres de fila y título de la página actual tras confirmación.
 */
async function clearAllCells() { 
    const confirmed = await showCustomConfirm("¿Estás seguro de que deseas borrar todas las notas y nombres de filas de esta hoja?");
    if (confirmed) { 
        document.querySelectorAll('.cell').forEach(cell => { cell.className = 'cell'; cell.innerHTML = ''; cell.style.color = ''; }); 
        document.querySelectorAll('.row-label').forEach(label => { label.textContent = ''; }); 
        document.querySelectorAll('.sheet-row').forEach(r => r.style.color = ''); 
        
        const sheetTitle = document.getElementById('sheetTitle');
        if (sheetTitle) sheetTitle.textContent = '';
        if (pagesData && pagesData[activePageIndex]) {
            pagesData[activePageIndex].title = '';
        }

        const firstCell = document.querySelector('.cell[data-row="0"][data-col="0"]'); 
        if (firstCell) selectCell(firstCell); 
        saveState(); 
    } 
}

/**
 * Desplaza automáticamente el foco/foco de selección hacia la celda a la derecha.
 */
function moveToNext() { 
    const nextCell = selectedCell.nextElementSibling; 
    if (nextCell) selectCell(nextCell); 
    else { selectedCell.classList.remove('selected'); selectedCell = null; } 
}

/**
 * Muestra una alerta emergente personalizada con solo el botón Aceptar.
 */
function showCustomAlert(message) {
    return new Promise((resolve) => {
        const modal = document.getElementById('customConfirmModal');
        const msgEl = document.getElementById('customConfirmMessage');
        const btnOk = document.getElementById('customConfirmBtnOk');
        const btnCancel = document.getElementById('customConfirmBtnCancel');

        msgEl.textContent = message;
        btnCancel.style.display = 'none';
        modal.classList.add('active');

        setTimeout(() => btnOk.focus(), 50);

        const cleanup = () => {
            modal.classList.remove('active');
            btnCancel.style.display = 'inline-block';
            btnOk.removeEventListener('click', handleOk);
            document.removeEventListener('keydown', handleKeyDown);
        };

        const handleOk = () => { cleanup(); resolve(); };

        const handleKeyDown = (e) => {
            if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); handleOk(); }
        };

        btnOk.addEventListener('click', handleOk);
        document.addEventListener('keydown', handleKeyDown);
    });
}

/**
 * Controla la lógica de la tecla Retroceso (Backspace) retrocediendo celdas si la actual está vacía.
 */
function handleDeleteButton() {
    if (!selectedCell) return;
    if (selectedCellsList.length > 1) { clearSelectedRange(); return; }
    let currentRow = parseInt(selectedCell.dataset.row);
    let currentCol = parseInt(selectedCell.dataset.col);
    
    if (selectedCell.innerHTML === '') { 
        if (currentCol > 0) { 
            currentCol--; 
            const target = document.querySelector(`.cell[data-row="${currentRow}"][data-col="${currentCol}"]`); 
            if (target) { selectCell(target); clearCell(); } 
        } 
    } else { clearCell(); }
    
    clearSelectionStyles();
    if (selectedCell) selectCell(selectedCell);
    saveState();
}

/**
 * Pinta de color rojo (#FF0000) los acordes o símbolos dentro de la selección activa.
 */
function applyRedToSelected() {
    if (!selectedCell) return;
    const applyRed = (cell) => {
        if (cell.textContent.trim() !== '' || cell.children.length > 0) {
            cell.style.color = "#FF0000";
            cell.querySelectorAll('svg *').forEach(el => {
                if (el.getAttribute('fill') && el.getAttribute('fill') !== 'none') el.style.fill = "#FF0000";
                if (el.getAttribute('stroke') && el.getAttribute('stroke') !== 'none') el.style.stroke = "#FF0000";
            });
        }
    };
    if (typeof selectedCellsList !== 'undefined' && selectedCellsList.length > 1) {
        selectedCellsList.forEach(cell => applyRed(cell));
    } else { applyRed(selectedCell); }
    saveState();
}

// --- PERSISTENCIA Y REGISTRO DE HISTORIAL ---

/**
 * Obtiene la imagen de los datos actuales del documento en un string JSON.
 */
function getCurrentSnapshot() {
    saveCurrentPageToMemory(activePageIndex); 
    return JSON.stringify({
        title: docTitle,
        activePageIndex: activePageIndex, // <-- Guardamos la página en la que estás parado
        pages: pagesData
    });
}

/**
 * Guarda el estado actual en la pila para la función Control + Z y en el almacenamiento de la pestaña.
 */
function saveState() {
    const snapshot = getCurrentSnapshot();
    if (undoStack.length === 0 || undoStack[undoStack.length - 1] !== snapshot) {
        undoStack.push(snapshot);
        if (undoStack.length > maxUndoSteps) undoStack.shift();
    }
    sessionStorage.setItem('sheetData_v10', snapshot);
}

/**
 * Restaura los datos del proyecto a partir de un JSON snapshot.
 */
function applySnapshot(snapshotJSON) {
    try {
        const data = typeof snapshotJSON === 'string' ? JSON.parse(snapshotJSON) : snapshotJSON;
        
        docTitle = data.title || docTitle;

        // --- MANEJO DE RETROCOMPATIBILIDAD ---
        if (data.pages && Array.isArray(data.pages)) {
            // Formato NUEVO (Multipágina)
            pagesData = data.pages;
            activePageIndex = (typeof data.activePageIndex === 'number' && data.activePageIndex < pagesData.length) ? data.activePageIndex : 0;
        } else {
            // Formato ANTIGUO (Una sola página directa)
            pagesData = [{
                title: data.title || "",
                labels: data.labels || [...defaultLabels],
                rowColors: data.rowColors || {},
                cells: data.cells || []
            }];
            activePageIndex = 0;
        }
    } catch(e) {
        console.error("Error al aplicar snapshot:", e);
    }
}

/**
 * Vuelve al paso anterior guardado en la pila undoStack (Control + Z).
 */
function undoState() { 
    if (undoStack.length > 1) { 
        undoStack.pop(); 
        const previousState = undoStack[undoStack.length - 1]; 
        applySnapshot(previousState); 
        renderPagesUI();
        loadPageFromMemory(activePageIndex < pagesData.length ? activePageIndex : 0);
        sessionStorage.setItem('sheetData_v10', previousState); 
    } 
}

/**
 * Carga el estado almacenado en el navegador al abrir la aplicación.
 */
function loadState() { 
    const saved = sessionStorage.getItem('sheetData_v10'); 
    if (!saved) {
        docTitle = "";
        pagesData = [createEmptyPageObject()];
        activePageIndex = 0;
        sheetTitle.textContent = "";
        renderPagesUI();
        loadPageFromMemory(0);
        return;
    }
    
    applySnapshot(saved); 
    undoStack = [saved]; 
    
    // Carga la página donde te quedaste en lugar de forzar siempre la 0
    renderPagesUI();
    loadPageFromMemory(activePageIndex);
}

// --- EXPORTAR / IMPORTAR PDF ---

/**
 * Procesa todas las hojas, las renderiza a canvas de alta resolución y descarga el archivo PDF con metadatos incrustados.
 */
async function exportToPDF() { 

if (document.activeElement) {
        document.activeElement.blur();
    }
    
    if (selectedCell) selectedCell.classList.remove('selected');
    clearSelectionStyles(); 
    
    saveCurrentPageToMemory(activePageIndex);

    const paperElement = document.getElementById('sheetPaper');
    const { jsPDF } = window.jspdf;
    
    // Configuración PDF Landscape A4
    const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4', compress: true }); 

    const originalActivePage = activePageIndex;

    // Congelar el overflow del body temporalmente para que no aparezcan barras de scroll
    const originalOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';

    for (let i = 0; i < pagesData.length; i++) {
        loadPageFromMemory(i);
        await waitFrame(); 

        const canvas = await html2canvas(paperElement, { 
            scale: 2, 
            backgroundColor: '#000000', 
            useCORS: true, 
            logging: false,
            // Forzar dimensiones exactas en la captura para evitar estiramientos
            width: paperElement.offsetWidth,
            height: paperElement.offsetHeight
        });

        const imgData = canvas.toDataURL('image/jpeg', 0.85);

        if (i > 0) pdf.addPage();

        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight = pdf.internal.pageSize.getHeight();
        const ratio = Math.min(pdfWidth / canvas.width, pdfHeight / canvas.height);
        const renderWidth = canvas.width * ratio;
        const renderHeight = canvas.height * ratio;
        const xOffset = (pdfWidth - renderWidth) / 2;
        const yOffset = (pdfHeight - renderHeight) / 2;

        pdf.addImage(imgData, 'JPEG', xOffset, yOffset, renderWidth, renderHeight);
    }

    // Restaurar estado visual y scroll original
    document.body.style.overflow = originalOverflow;
    loadPageFromMemory(originalActivePage);

    if (!docTitle || docTitle === "") {
        docTitle = pagesData[0]?.title || "GORRION";
    }

    // Incrustar metadata
    const currentStateStr = JSON.stringify({ title: docTitle, pages: pagesData });
    const encodedData = btoa(unescape(encodeURIComponent(currentStateStr)));

   pdf.setProperties({ title: docTitle, subject: encodedData });

const rawTitle = docTitle.trim() || 'Partitura';

// Transforma la primera letra de cada palabra a mayúscula y el resto a minúscula
const formattedTitle = rawTitle
    .toLowerCase()
    .replace(/(^|\s+)[a-záéíóúñ]/g, (letter) => letter.toUpperCase());

pdf.save(`${formattedTitle}.pdf`);

    if (selectedCell) selectCell(selectedCell); 
}

/**
 * Abre un PDF generado por la aplicación, extrae los datos JSON metidos en 'Subject' y restaura las hojas editables.
 */
async function importPDFWithMetadata(event) {
    const file = event.target.files[0];
    if (!file) return;

    try {
        const arrayBuffer = await file.arrayBuffer();
        const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
        const pdf = await loadingTask.promise;

        let loadedState = null;
        const metadata = await pdf.getMetadata();

        if (metadata && metadata.info) {
  const rawData = metadata.info.Subject || metadata.info.Keywords || metadata.info.Title;
  if (rawData) {
    // 1. Probar Base64 estándar (Python clásico)
    try {
      loadedState = JSON.parse(atob(rawData));
    } catch (e1) {
      // 2. Probar Base64 + URI Component (jsPDF web)
      try {
        loadedState = JSON.parse(decodeURIComponent(escape(atob(rawData))));
      } catch (e2) {
        // 3. Probar URI Component directo (sin base64)
        try {
          loadedState = JSON.parse(decodeURIComponent(rawData));
        } catch (e3) {
          // 4. Probar JSON plano en texto claro
          try {
            loadedState = JSON.parse(rawData);
          } catch (e4) {
            console.warn("No se pudo parsear el metadato con ninguna estrategia conocida.");
          }
        }
      }
    }
  }
}

        if (loadedState) {
      // Normalización garantizada para evitar pantalla negra / errores de render
      if (!loadedState.pages || !Array.isArray(loadedState.pages)) {
        loadedState = {
          title: loadedState.title || "",
          pages: [{
            title: loadedState.title || "",
            labels: loadedState.labels || [...defaultLabels],
            rowColors: loadedState.rowColors || {},
            cells: loadedState.cells || []
          }]
        };
      } else {
        // Aseguramos que cada hoja dentro de 'pages' tenga sus arrays limpios
        loadedState.pages = loadedState.pages.map(page => ({
          title: page.title || "",
          labels: page.labels || [...defaultLabels],
          rowColors: page.rowColors || {},
          cells: page.cells || []
        }));
      }

      docTitle = loadedState.title || docTitle;
      pagesData = loadedState.pages;
      activePageIndex = 0;

      renderPagesUI();
      loadPageFromMemory(0);

      undoStack = [getCurrentSnapshot()];
      sessionStorage.setItem('sheetData_v10', getCurrentSnapshot());

      await showCustomAlert(`Partitura "${docTitle}" importada con éxito (${pagesData.length} hoja/s).`);
    } else {
      await showCustomAlert("Este PDF no contiene datos editables válidos.");
    }
  } catch (error) {
    console.error("Error al cargar PDF:", error);
    await showCustomAlert("Ocurrió un error al procesar el PDF.");
  }
  event.target.value = "";
}

// Inicializar estado al cargar la página en el navegador
loadState();
