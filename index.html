<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Anotaciones Musicales</title>
    <!-- Librerías para captura de pantalla, procesamiento PDF y metadatos -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        /* --- ESTILOS GENERALES Y FONDO --- */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Arial, sans-serif; 
        }
        html, body { 
            background-color: #0b0f19; 
            color: #ffffff; 
            display: flex; 
            height: 100vh; 
            width: 100vw; 
            overflow: hidden; 
        }

        /* --- BARRA LATERAL (SIDEBAR) --- */
        .sidebar { 
            width: 360px; 
            min-width: 360px; 
            background-color: #111827; 
            border-right: 1px solid #1f2937; 
            padding: 22px; 
            display: flex; 
            flex-direction: column; 
            gap: 22px; 
            overflow-y: auto; 
            z-index: 10; 
        }
        .sidebar h3 { 
            font-size: 0.9rem; 
            color: #6b7280; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            margin-bottom: 12px; 
        }
        .palette-group { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 10px; 
        }

        /* --- BOTONES DE LA PALETA --- */
        .symbol-btn { 
            background-color: #1f2937; 
            color: #f3f4f6; 
            border: 1px solid #374151; 
            padding: 14px 6px; 
            min-height: 52px; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 1.1rem; 
            cursor: pointer; 
            text-align: center; 
            user-select: none; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .symbol-btn:hover { 
            background-color: #2563eb; 
            border-color: #3b82f6; 
        }

        .symbol-btn.btn-delete {
            background-color: #22106C !important;
            border-color: #311c8a !important; 
        }
        .symbol-btn.btn-delete:hover {
            background-color: #2d168f !important; 
        }

        .symbol-btn.btn-large-symbol {
            font-size: 1.6rem !important;
            font-weight: 700;
        }

        /* --- BOTONES DE ACCIÓN --- */
        .danger-btn {
            background-color: #991b1b; 
            color: white;
            border: 1px solid #b91c1c; 
            padding: 14px; 
            border-radius: 8px; 
            font-size: 1rem; 
            font-weight: bold; 
            cursor: pointer; 
            width: 100%;
        }
        .danger-btn:hover {
            background-color: #7f1d1d;
        }

        .export-btn { 
    /* margin-top: auto;  👈 Borra esta línea si la tienes */
    background-color: #059669; 
    color: white; 
    border: none; 
    padding: 14px; 
    border-radius: 8px; 
    font-size: 1.1rem; 
    font-weight: bold; 
    cursor: pointer; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    gap: 8px; 
    width: 100%;
}
        .export-btn:hover { 
            background-color: #047857; 
        }

        .import-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-align: center;
        }
        .import-btn:hover {
            background-color: #1d4ed8;
        }

        /* --- CONTENEDOR PRINCIPAL Y LIENZO --- */
        .main-content { 
            flex: 1; 
            padding: 20px; 
            background-color: #0b0f19; 
            overflow: auto; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            box-sizing: border-box; 
        }
        .paper { 
            background-color: #000000 !important; 
            color: #ffffff; 
            width: 100%; 
            max-width: 1400px; 
            aspect-ratio: 297 / 210; 
            padding: 20px 45px 25px 45px; 
            border: 2px solid #1e293b; 
            border-radius: 4px; 
            display: flex; 
            flex-direction: column; 
            box-sizing: border-box; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); 
            overflow: hidden; 
        }

        .sheet-title { 
            text-align: center; 
            font-size: 2.0rem; 
            font-weight: 900; 
            outline: none; 
            margin-bottom: 8px; 
            text-transform: uppercase; 
            color: #FFFFFF; 
            letter-spacing: 1px; 
            line-height: 1; 
        }

        /* --- FILAS Y CELDAS --- */
        .rows-container { 
            display: flex;
            flex-direction: column;
            justify-content: flex-start; 
            gap: 20px; 
            flex: 1; 
            overflow: hidden; 
            margin-top: 5px; 
        }
        .sheet-row { 
            display: flex; 
            align-items: center; 
            width: 100%; 
            height: 36px; 
            gap: 8px; 
            position: relative; 
        }
        .row-label { 
            width: 130px; 
            min-width: 130px; 
            max-width: 130px; 
            font-weight: 700; 
            font-size: 1.4rem; 
            outline: none; 
            border-bottom: none; 
            padding-right: 4px; 
            color: inherit; 
            white-space: nowrap; 
            overflow: hidden; 
            transition: background-color 0.2s; 
        }
        .row-label:focus { 
            background-color: #1f2937; 
            outline: none; 
        }
        .row-cells { 
            display: grid; 
            grid-template-columns: repeat(32, minmax(0, 1fr)); 
            align-items: center; 
            flex: 1; 
            height: 100%; 
            gap: 4px; 
            margin-left: 10px; 
        }

        .cell { 
            height: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: 700; 
            font-size: 1.6rem; 
            line-height: 1;
            letter-spacing: -0.5px; 
            cursor: pointer; 
            user-select: none; 
            position: relative; 
            color: inherit; 
            white-space: nowrap; 
            overflow: visible; 
            border-bottom: none; 
            text-align: center;
        }
        .cell.multi-selected {
            background-color: rgba(37, 99, 235, 0.45) !important;
            outline: 1px dashed #60a5fa;
        }
        .cell.selected::after { 
            content: ''; 
            position: absolute; 
            bottom: 1px; 
            left: 0; 
            width: 100%; 
            height: 3px; 
            background-color: #FF0000; 
            animation: blink-cursor 1s step-end infinite; 
        }
        @keyframes blink-cursor { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        
        .cell svg circle, .cell svg rect, .cell svg line, .cell svg polyline { fill: none; stroke: currentColor; }
        .cell.is-repeat svg circle { fill: currentColor !important; }
        
        .cell.is-pause svg path { fill: #FF0000 !important; stroke: none; fill-rule: evenodd; }
        .cell.is-pause svg { display: block; margin: 0 auto; }

        .cell.is-arrow, .cell.is-left-arrow-container, .cell.is-power, .cell.is-pause, .cell.is-slash, .cell.is-quarter-note { color: #FF0000 !important; }
        .cell.is-arrow svg *, .cell.is-left-arrow-container svg *, .cell.is-quarter-note svg * { stroke: #FF0000 !important; fill: none; }
        .cell.is-left-arrow-container .arrow-subnum, .cell.is-power .power-num { color: #FF0000 !important; }

        /* REGLA STRICTA PARA FLECHA SVG */
        .cell.is-arrow {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }
        .cell.is-arrow svg.arrow-svg {
            width: 30px !important;
            height: 30px !important;
            display: block !important;
        }

        .cell.is-only-start-bracket, .cell.is-only-end-bracket { 
            display: flex;
            align-items: center;
            justify-content: center; 
        }
        .cell.is-only-start-bracket svg, .cell.is-only-end-bracket svg {
            display: block;
        }

        .cell .bar-char { font-size: 2.0rem; font-weight: 700; margin: 0; line-height: 1; }
        .cell.is-bar, .cell.is-slash { font-size: 2.0rem !important; font-weight: 700 !important; }

        .cell.is-power { position: relative; }
        .cell.is-power .power-num { position: absolute; top: -0px; left: 5px; font-size: 1.4rem; font-weight: 900; line-height: 1; }
        .cell.is-left-arrow-container { display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
        .cell.is-left-arrow-container .arrow-subnum { font-size: 1.1rem; font-weight: 900; margin-top: -3px; }

        .color-select { width: 100%; background-color: #1f2937; color: #ffffff; border: 1px solid #374151; padding: 12px; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; outline: none; }
        .color-select option { background-color: #111827; color: #ffffff; }
        .cell.has-red-color,
.cell.has-red-color *,
.row .cell.has-red-color,
.row .cell.has-red-color * {
    color: #FF0000 !important;
    fill: #FF0000 !important;
    stroke: #FF0000 !important;
}
    
    
    </style>

</head>
<body>

    <div class="sidebar">
        
        <div>
            <h3>Acordes</h3>
            <div class="palette-group">
                <button class="symbol-btn" onclick="insertSymbol('C')">C</button>
                <button class="symbol-btn" onclick="insertSymbol('Cm')">Cm</button>
                <button class="symbol-btn" onclick="insertSymbol('C#')">C#</button>
                <button class="symbol-btn" onclick="insertSymbol('C#m')">C#m</button>
                <button class="symbol-btn" onclick="insertSymbol('D')">D</button>
                <button class="symbol-btn" onclick="insertSymbol('Dm')">Dm</button>
                <button class="symbol-btn" onclick="insertSymbol('D#')">D#</button>
                <button class="symbol-btn" onclick="insertSymbol('D#m')">D#m</button>
                <button class="symbol-btn" onclick="insertSymbol('F')">F</button>
                <button class="symbol-btn" onclick="insertSymbol('Fm')">Fm</button>
                <button class="symbol-btn" onclick="insertSymbol('F#')">F#</button>
                <button class="symbol-btn" onclick="insertSymbol('F#m')">F#m</button>
                <button class="symbol-btn" onclick="insertSymbol('G')">G</button>
                <button class="symbol-btn" onclick="insertSymbol('Gm')">Gm</button>
                <button class="symbol-btn" onclick="insertSymbol('G#')">G#</button>
                <button class="symbol-btn" onclick="insertSymbol('G#m')">G#m</button>
                <button class="symbol-btn" onclick="insertSymbol('A')">A</button>
                <button class="symbol-btn" onclick="insertSymbol('Am')">Am</button>
                <button class="symbol-btn" onclick="insertSymbol('A#')">A#</button>
                <button class="symbol-btn" onclick="insertSymbol('A#m')">A#m</button>
                <button class="symbol-btn" onclick="insertSymbol('E')">E</button>
                <button class="symbol-btn" onclick="insertSymbol('Em')">Em</button>
                <button class="symbol-btn" onclick="insertSymbol('B')">B</button>
                <button class="symbol-btn" onclick="insertSymbol('Bm')">Bm</button>
            </div>
        </div>

        <div>
            <h3>Símbolos Especiales</h3>
            <div class="palette-group">
                <button class="symbol-btn" title="Corchete Izquierdo" onclick="insertSpecial('only-start-bracket')">
                    <svg width="12" height="28" viewBox="0 0 14 38" fill="none"><path d="M12 2H2V36H12" stroke="currentColor" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/></svg>
                </button>
                <button class="symbol-btn" title="Corchete Derecho" onclick="insertSpecial('only-end-bracket')">
                    <svg width="12" height="28" viewBox="0 0 14 38" fill="none"><path d="M2 2H12V36H2" stroke="currentColor" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/></svg>
                </button>
                <button class="symbol-btn btn-large-symbol" onclick="insertSymbol('|')">|</button>
                <button class="symbol-btn btn-delete" title="Borrar (Backspace)" onclick="handleDeleteButton()">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
                        <line x1="18" y1="9" x2="12" y2="15"></line>
                        <line x1="12" y1="9" x2="18" y2="15"></line>
                    </svg>
                </button>
                
                <button class="symbol-btn" title="Pausa / Redonda" onclick="insertSymbol('pausa')">
                    <svg width="38" height="26" viewBox="0 0 100 70"><path fill="#FF0000" fill-rule="evenodd" d="M 50 0 C 77.6 0 100 15.7 100 35 C 100 54.3 77.6 70 50 70 C 22.4 70 0 54.3 0 35 C 0 15.7 22.4 0 50 0 Z M 50 11 C 41.5 11 36 21 36 35 C 36 49 41.5 59 50 59 C 58.5 59 64 49 64 35 C 64 21 58.5 11 50 11 Z" transform="rotate(-18 50 35)"/></svg>
                </button>
                <button class="symbol-btn" title="Nota Negra" onclick="insertSymbol('negra')">
                    <svg width="32" height="32" viewBox="0 0 24 24">
                        <circle cx="9" cy="17" r="5" fill="#FF0000" stroke="#FF0000" stroke-width="1"/>
                        <line x1="13.5" y1="17" x2="13.5" y2="3" stroke="#FF0000" stroke-width="3.5" stroke-linecap="round"/>
                    </svg>
                </button>
                <button class="symbol-btn" onclick="insertSymbol('%')">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <circle cx="6.5" cy="7.5" r="3.5" fill="currentColor"/>
                        <circle cx="17.5" cy="16.5" r="3.5" fill="currentColor"/>
                        <line x1="4" y1="21" x2="20" y2="3" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                    </svg>
                </button>
                <button class="symbol-btn" title="Repetición + Barra" onclick="insertRepeatBar()">
                    <svg width="28" height="22" viewBox="0 0 28 22" style="display: block;">
                        <circle cx="5" cy="6" r="2.8" fill="currentColor"/>
                        <circle cx="13" cy="16" r="2.8" fill="currentColor"/>
                        <line x1="3" y1="19" x2="15" y2="3" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                        <line x1="23" y1="2" x2="23" y2="20" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
                    </svg>
                </button>

                <button class="symbol-btn btn-large-symbol" style="color: #FF0000;" onclick="insertSymbol('/')">/</button>
                <button class="symbol-btn" title="Flecha Izquierda" onclick="insertSymbol('←')">
                    <svg width="22" height="22" viewBox="0 0 24 24">
                        <line x1="20" y1="12" x2="4" y2="12" stroke="#FF0000" stroke-width="4" stroke-linecap="round"/>
                        <polyline points="11,5 4,12 11,19" fill="none" stroke="#FF0000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <button class="symbol-btn" title="Flecha Arriba" onclick="insertSymbol('↑')">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <line x1="12" y1="22" x2="12" y2="4" stroke="#FF0000" stroke-width="4" stroke-linecap="round"/>
                        <polyline points="5,11 12,4 19,11" fill="none" stroke="#FF0000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <button class="symbol-btn" style="color: #FF0000;" onclick="insertSymbol('x2', true)">x2</button>
                
                <button class="symbol-btn" style="color: #FF0000;" onclick="insertSymbol('x3', true)">x3</button>
                <button class="symbol-btn" style="color: #FF0000;" onclick="insertSymbol('x4', true)">x4</button>
                <button class="symbol-btn" style="color: #FF0000;" onclick="insertSymbol('x5', true)">x5</button>
                <button class="symbol-btn" style="color: #FF0000;" onclick="insertSymbol('x6', true)">x6</button>
                
                <button class="symbol-btn" style="color: #FF0000;" onclick="insertSymbol('x7', true)">x7</button>
                <button class="symbol-btn" style="color: #FF0000;" onclick="insertSymbol('x8', true)">x8</button>
                <button class="symbol-btn" style="color: #FF0000;" onclick="insertSymbol('x9', true)">x9</button>
                <button class="symbol-btn" style="background-color: #991b1b; color: white;" onclick="applyRedToSelected()">Rojo</button>
</button>
            </div>
        </div>

        <div>
            <h3>Color de Texto (Fila Activa)</h3>
            <select id="textColorSelect" class="color-select" onchange="changeActiveRowTextColor(this.value)">
                <option value="#FFFFFF">⚪ Blanco</option>
                <option value="#28831A">🟢 Verde</option>
            </select>
        </div>

        <div>
            <button class="danger-btn" onclick="clearAllCells()"> 🧹 Limpiar Lienzo </button>
        </div>

        <button class="export-btn" onclick="exportToPDF()">📄 Descargar PDF</button>

<div style="margin-top: 10px;">
    <input type="file" id="pdfFileInput" accept=".pdf" style="display: none;" onchange="importPDFWithMetadata(event)">
    <label for="pdfFileInput" class="import-btn" style="width: 100%;">📂 Abrir PDF</label>
</div>
    
    </div>

    <div class="main-content">
        <div class="paper" id="sheetPaper">
            <div class="sheet-title" id="sheetTitle" contenteditable="true">GORRION</div>
            <div class="rows-container" id="rowsContainer"></div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let selectedCell = null;
        let selectionStart = null;
        let isMouseDown = false;
        let selectedCellsList = [];
        let clipboardData = null; 

        let undoStack = [];
        const maxUndoSteps = 50;

        const defaultLabels = ["", "", "", "", "", "", "", "", "", "", "", "", "", "", "", ""];
        const maxCols = 31;
        const maxRows = 15;

        // SVG Oficial de la flecha hacia arriba
        const ARROW_UP_SVG = `<svg class="arrow-svg" viewBox="0 0 24 24"><line x1="12" y1="22" x2="12" y2="4" stroke-width="4" stroke-linecap="round"/><polyline points="5,11 12,4 19,11" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

        const rowsContainer = document.getElementById('rowsContainer');
        const sheetTitle = document.getElementById('sheetTitle');
        const colorSelect = document.getElementById('textColorSelect');
        
        for (let i = 0; i <= maxRows; i++) { 
            const row = document.createElement('div');
            row.className = 'sheet-row';
            row.dataset.rowIndex = i;
            const label = document.createElement('div');
            label.className = 'row-label';
            label.contentEditable = "true";
            label.dataset.rowIndex = i;
            label.textContent = defaultLabels[i] || "";
            label.addEventListener('input', saveState);
            label.addEventListener('click', () => { const firstCell = row.querySelector('.cell'); if (firstCell) selectCell(firstCell); });
            row.appendChild(label);
            const cellsContainer = document.createElement('div');
            cellsContainer.className = 'row-cells';
            for (let j = 0; j <= maxCols; j++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.row = i;
                cell.dataset.col = j;
                cell.addEventListener('mousedown', (e) => { 
                    isMouseDown = true; 
                    selectionStart = { row: parseInt(cell.dataset.row), col: parseInt(cell.dataset.col) }; 
                    selectCell(cell);
                });
                cell.addEventListener('mouseenter', () => { 
                    if (isMouseDown && selectionStart) { 
                        const current = { row: parseInt(cell.dataset.row), col: parseInt(cell.dataset.col) }; 
                        selectCellRange(selectionStart, current); 
                    } 
                });
                cellsContainer.appendChild(cell);
            }
            row.appendChild(cellsContainer);
            rowsContainer.appendChild(row);
        }

        document.addEventListener('mouseup', () => { 
            isMouseDown = false; 
            if (selectedCellsList.length <= 1) { 
                clearSelectionStyles(); 
                if (selectedCell) selectedCell.classList.add('selected'); 
            } 
        });
        sheetTitle.addEventListener('input', saveState);

        function selectCellRange(start, end) {
            clearSelectionStyles();
            const minRow = Math.min(start.row, end.row), maxRow = Math.max(start.row, end.row), minCol = Math.min(start.col, end.col), maxCol = Math.max(start.col, end.col);
            selectedCellsList = [];
            for (let r = minRow; r <= maxRow; r++) { 
                for (let c = minCol; c <= maxCol; c++) { 
                    const cell = document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`); 
                    if (cell) { 
                        cell.classList.add('multi-selected'); 
                        selectedCellsList.push(cell); 
                    } 
                } 
            }
            const activeCell = document.querySelector(`.cell[data-row="${start.row}"][data-col="${start.col}"]`);
            if (activeCell) { 
                if (selectedCell) selectedCell.classList.remove('selected'); 
                selectedCell = activeCell; 
                selectedCell.classList.add('selected'); 
                const row = selectedCell.closest('.sheet-row'); 
                if (row) { 
                    const computedColor = window.getComputedStyle(row).color; 
                    if (computedColor.includes('40, 131, 26') || row.style.color === '#28831A') { 
                        colorSelect.value = '#28831A'; 
                    } else { 
                        colorSelect.value = '#FFFFFF'; 
                    } 
                } 
            }
        }

        function clearSelectionStyles() { 
            document.querySelectorAll('.cell.multi-selected').forEach(c => c.classList.remove('multi-selected')); 
        }

        function selectCell(cell) {
            clearSelectionStyles();
            if (selectedCell) selectedCell.classList.remove('selected');
            selectedCell = cell;
            selectedCell.classList.add('selected');
            selectedCellsList = [cell];
            const row = selectedCell.closest('.sheet-row');
            if (row) { 
                const computedColor = window.getComputedStyle(row).color; 
                if (computedColor.includes('40, 131, 26') || row.style.color === '#28831A') { 
                    colorSelect.value = '#28831A'; 
                } else { 
                    colorSelect.value = '#FFFFFF'; 
                } 
            }
        }

        function changeActiveRowTextColor(colorHex) { 
    if (!selectedCell) return; 
    
    const targetRow = selectedCell.closest('.sheet-row'); 
    
    if (targetRow) { 
        targetRow.style.color = colorHex; 

        // Lista exacta de las clases de símbolos que SIEMPRE deben ser rojos
        const fixedRedClasses = [
            'is-arrow', 
            'is-left-arrow-container', 
            'is-power', 
            'is-pause', 
            'is-slash', 
            'is-quarter-note'
        ];

        const cells = targetRow.querySelectorAll('.cell');
        cells.forEach(cell => {
            // Verificamos si la celda es de los símbolos fijos rojos
            const isAlwaysRedSymbol = fixedRedClasses.some(cls => cell.classList.contains(cls));

            // Si NO es un símbolo fijo rojo (es nota, corchete, texto, etc.), limpiamos el rojo manual
            if (!isAlwaysRedSymbol) {
                cell.style.color = ''; 
                
                const svgs = cell.querySelectorAll('svg *');
                svgs.forEach(el => {
                    el.style.fill = '';
                    el.style.stroke = '';
                });
            }
        });

        saveState(); 
    } 
}
        document.addEventListener('keydown', (e) => {
            if (document.activeElement && document.activeElement.isContentEditable) return;
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undoState(); return; }
            if (!selectedCell) return;

            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') { e.preventDefault(); copySelectedRange(); clearSelectionStyles(); if (selectedCell) selectedCell.classList.add('selected'); return; }
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'x') { e.preventDefault(); cutSelectedRange(); return; }
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v') { e.preventDefault(); pasteSelectedRange(); return; }
            
            if (selectedCell.classList.contains('is-left-arrow-container') && /^[0-9]$/.test(e.key)) { 
                e.preventDefault(); 
                let subNum = selectedCell.querySelector('.arrow-subnum'); 
                if (!subNum) { 
                    subNum = document.createElement('span'); 
                    subNum.className = 'arrow-subnum'; 
                    selectedCell.appendChild(subNum); 
                } 
                subNum.textContent = e.key; 
                saveState(); 
                return; 
            }

            let currentRow = parseInt(selectedCell.dataset.row), currentCol = parseInt(selectedCell.dataset.col), moved = false;
            
            if (e.key === 'Backspace') { e.preventDefault(); handleDeleteButton(); return; }
            else if (e.key === 'Delete') { e.preventDefault(); if (selectedCellsList.length > 1) clearSelectedRange(); else clearCell(); return; }
            
            if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); if (currentCol < maxCols) currentCol++; moved = true; }
            else if (e.key === 'ArrowRight') { e.preventDefault(); if (currentCol < maxCols) currentCol++; moved = true; }
            else if (e.key === 'ArrowLeft') { e.preventDefault(); if (currentCol > 0) currentCol--; moved = true; }
            else if (e.key === 'ArrowDown') { e.preventDefault(); if (currentRow < maxRows) currentRow++; moved = true; }
            else if (e.key === 'ArrowUp') { e.preventDefault(); if (currentRow > 0) currentRow--; moved = true; }
            else if (e.key === 'Enter') { e.preventDefault(); if (currentRow < maxRows) { currentRow++; currentCol = 0; } moved = true; }
            
            if (moved) { 
                const nextTarget = document.querySelector(`.cell[data-row="${currentRow}"][data-col="${currentCol}"]`); 
                if (nextTarget) { selectCell(nextTarget); } 
            }
        });

        function copySelectedRange() {
            if (!selectedCellsList.length) return;
            let minRow = Infinity, maxRow = -Infinity, minCol = Infinity, maxCol = -Infinity;
            selectedCellsList.forEach(c => { const r = parseInt(c.dataset.row), col = parseInt(c.dataset.col); if (r < minRow) minRow = r; if (r > maxRow) maxRow = r; if (col < minCol) minCol = col; if (col > maxCol) maxCol = col; });
            const matrix = [];
            for (let r = minRow; r <= maxRow; r++) { const rowArray = []; for (let c = minCol; c <= maxCol; c++) { const cell = document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`); if (cell) { const cleanClass = cell.className.replace('multi-selected', '').replace('selected', '').trim(); rowArray.push({ className: cleanClass === '' ? 'cell' : cleanClass, html: cell.innerHTML }); } } matrix.push(rowArray); }
            clipboardData = matrix;
        }

        function cutSelectedRange() {
            if (!selectedCellsList.length && !selectedCell) return;
            copySelectedRange();
            if (selectedCellsList.length > 1) {
                clearSelectedRange();
            } else {
                clearCell();
            }
        }

        function clearSelectedRange() { 
            selectedCellsList.forEach(cell => { cell.className = 'cell'; cell.innerHTML = ''; }); 
            clearSelectionStyles(); 
            if (selectedCell) selectCell(selectedCell); 
            saveState(); 
        }

        function pasteSelectedRange() { 
            if (!clipboardData || !selectedCell) return; 
            const startRow = parseInt(selectedCell.dataset.row), startCol = parseInt(selectedCell.dataset.col), numRows = clipboardData.length, numCols = clipboardData[0].length; 
            for (let r = 0; r < numRows; r++) { 
                for (let c = 0; c < numCols; c++) { 
                    const targetRow = startRow + r, targetCol = startCol + c; 
                    if (targetRow <= maxRows && targetCol <= maxCols) { 
                        const targetCell = document.querySelector(`.cell[data-row="${targetRow}"][data-col="${targetCol}"]`); 
                        if (targetCell) { 
                            const source = clipboardData[r][c]; 
                            targetCell.className = source.className; 
                            targetCell.innerHTML = source.html; 
                        } 
                    } 
                } 
            } 
            clearSelectionStyles(); 
            selectCell(selectedCell); 
            saveState(); 
        }

        function insertSpecial(type) {
            if (!selectedCell) return;
            selectedCell.className = 'cell selected';
            if (type === 'only-start-bracket') { 
                selectedCell.innerHTML = `<svg width="14" height="38" viewBox="0 0 14 38" fill="none"><path d="M12 2H2V36H12" stroke="currentColor" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="miter"/></svg>`; 
                selectedCell.classList.add('is-only-start-bracket'); 
            } 
            else if (type === 'only-end-bracket') { 
                selectedCell.innerHTML = `<svg width="14" height="38" viewBox="0 0 14 38" fill="none"><path d="M2 2H12V36H2" stroke="currentColor" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="miter"/></svg>`; 
                selectedCell.classList.add('is-only-end-bracket'); 
            }
            saveState(); 
            moveToNext();
        }

        function insertSymbol(symbol, isPower = false) {
            if (!selectedCell) return;
            selectedCell.className = 'cell selected';
            if (isPower) {
                selectedCell.innerHTML = `<span class="power-num">${symbol}</span>`;
                selectedCell.classList.add('is-power');
            } else if (symbol === '%') {
                selectedCell.innerHTML = `<svg class="repeat-svg" width="30" height="30" viewBox="0 0 24 24"><circle cx="6.5" cy="7.5" r="3.5" fill="currentColor"/><circle cx="17.5" cy="16.5" r="3.5" fill="currentColor"/><line x1="4" y1="21" x2="20" y2="3" stroke-width="4" stroke-linecap="round"/></svg>`;
                selectedCell.classList.add('is-repeat');
            } else if (symbol === 'pausa') {
                selectedCell.innerHTML = `<svg class="pause-svg" width="46" height="32" viewBox="0 0 100 70"><path fill="#FF0000" fill-rule="evenodd" d="M 50 0 C 77.6 0 100 15.7 100 35 C 100 54.3 77.6 70 50 70 C 22.4 70 0 54.3 0 35 C 0 15.7 22.4 0 50 0 Z M 50 11 C 41.5 11 36 21 36 35 C 36 49 41.5 59 50 59 C 58.5 59 64 49 64 35 C 64 21 58.5 11 50 11 Z" transform="rotate(-18 50 35)"/></svg>`;
                selectedCell.classList.add('is-pause');
            } else if (symbol === '↑') {
                selectedCell.innerHTML = ARROW_UP_SVG;
                selectedCell.classList.add('is-arrow');
            } else if (symbol === 'negra') {
                selectedCell.innerHTML = `<svg width="32" height="32" viewBox="0 0 24 24"><circle cx="9" cy="17" r="5" fill="#FF0000" style="fill: #FF0000 !important;"/><line x1="13.5" y1="17" x2="13.5" y2="3" stroke="#FF0000" stroke-width="3.5" stroke-linecap="round"/></svg>`;
                selectedCell.classList.add('is-quarter-note');
            } else if (symbol === '←') {
                selectedCell.innerHTML = `<svg class="arrow-svg" width="28" height="24" viewBox="0 0 24 24"><line x1="20" y1="12" x2="4" y2="12" stroke-width="4" stroke-linecap="round"/><polyline points="11,5 4,12 11,19" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="arrow-subnum"></span>`;
                selectedCell.classList.add('is-left-arrow-container');
            } else {
                selectedCell.textContent = symbol;
                if (symbol.length >= 3) selectedCell.classList.add('is-long-chord');
                if (symbol === '|') selectedCell.classList.add('is-bar');
                if (symbol === '/') selectedCell.classList.add('is-slash');
            }
            if (symbol !== '←') moveToNext();
            saveState();
        }

        function insertRepeatBar() {
            if (!selectedCell) return;
            selectedCell.className = 'cell selected';
            selectedCell.innerHTML = `<svg class="repeat-svg" width="30" height="30" viewBox="0 0 24 24"><circle cx="6.5" cy="7.5" r="3.5" fill="currentColor"/><circle cx="17.5" cy="16.5" r="3.5" fill="currentColor"/><line x1="4" y1="21" x2="20" y2="3" stroke-width="4" stroke-linecap="round"/></svg>`;
            selectedCell.classList.add('is-repeat');
            
            const nextCell = selectedCell.nextElementSibling;
            if (nextCell) {
                selectCell(nextCell);
                selectedCell.className = 'cell selected';
                selectedCell.textContent = '|';
                selectedCell.classList.add('is-bar');
                moveToNext();
            }
            saveState();
        }

       function clearCell(cell = selectedCell) {
    if (!cell) return;
    
    // 1. Limpiamos el texto y contenido HTML interno
    cell.innerHTML = '';
    
    // 2. LIMPIAMOS EL COLOR MANUAL para que no herede el rojo al volver a escribir
    cell.style.color = '';
    
    // 3. Reseteamos las clases (si usas classes para estados)
    cell.className = 'cell selected';
    
    if (typeof saveState === 'function') saveState();
}

        function clearAllCells() { 
            if (confirm("¿Estás seguro de que deseas borrar todas las notas y nombres de filas?")) { 
                document.querySelectorAll('.cell').forEach(cell => { cell.className = 'cell'; cell.innerHTML = ''; }); 
                document.querySelectorAll('.row-label').forEach(label => { label.textContent = ''; }); 
                document.querySelectorAll('.sheet-row').forEach(r => r.style.color = ''); 
                const firstCell = document.querySelector('.cell[data-row="0"][data-col="0"]'); 
                if (firstCell) selectCell(firstCell); 
                saveState(); 
            } 
        }

        function moveToNext() { 
            const nextCell = selectedCell.nextElementSibling; 
            if (nextCell) selectCell(nextCell); 
            else { 
                selectedCell.classList.remove('selected'); 
                selectedCell = null; 
            } 
        }

        function getCurrentSnapshot() { 
            const data = { title: sheetTitle.textContent, selectedCellPos: selectedCell ? { row: selectedCell.dataset.row, col: selectedCell.dataset.col } : null, labels: [], rowColors: {}, cells: [] }; 
            document.querySelectorAll('.row-label').forEach(label => { data.labels.push(label.textContent); }); 
            document.querySelectorAll('.sheet-row').forEach(row => { if (row.style.color) { data.rowColors[row.dataset.rowIndex] = row.style.color; } }); 
            document.querySelectorAll('.cell').forEach(cell => { if (cell.innerHTML.trim() !== '') { data.cells.push({ row: cell.dataset.row, col: cell.dataset.col, className: cell.className.replace('selected', '').replace('multi-selected', '').trim(), html: cell.innerHTML }); } }); 
            return JSON.stringify(data); 
        }

        function applySnapshot(snapshotJSON) { 
            try { 
                const data = typeof snapshotJSON === 'string' ? JSON.parse(snapshotJSON) : snapshotJSON; 
                if (data.title) sheetTitle.textContent = data.title; 
                
                document.querySelectorAll('.cell').forEach(cell => { cell.className = 'cell'; cell.innerHTML = ''; }); 
                
                if (data.labels) { 
                    const labelDivs = document.querySelectorAll('.row-label'); 
                    data.labels.forEach((text, i) => { if (labelDivs[i]) labelDivs[i].textContent = text; }); 
                } 

                document.querySelectorAll('.sheet-row').forEach(r => r.style.color = ''); 
                if (data.rowColors) { 
                    Object.keys(data.rowColors).forEach(rowIndex => { 
                        const targetRow = document.querySelector(`.sheet-row[data-row-index="${rowIndex}"]`); 
                        if (targetRow) targetRow.style.color = data.rowColors[rowIndex]; 
                    }); 
                } 

                if (data.cells) { 
                    data.cells.forEach(cData => { 
                        const cell = document.querySelector(`.cell[data-row="${cData.row}"][data-col="${cData.col}"]`); 
                        if (cell) { 
                            let rawClasses = cData.className.split(' ').filter(cls => cls !== 'cell' && cls !== 'selected' && cls !== 'multi-selected');
                            let cellContent = cData.html;

                            // 🎯 DETECTAR Y REEMPLAZAR CUALQUIER TEXTO DE FLECHA ANTIGUO POR SVG
                            if (cellContent.includes('↑') || cellContent.trim() === '↑' || rawClasses.includes('is-arrow')) {
                                cellContent = ARROW_UP_SVG;
                                if (!rawClasses.includes('is-arrow')) rawClasses.push('is-arrow');
                            }

                            cell.className = 'cell ' + rawClasses.join(' '); 
                            cell.innerHTML = cellContent; 
                        } 
                    }); 
                } 

                if (data.selectedCellPos) { 
                    const targetCell = document.querySelector(`.cell[data-row="${data.selectedCellPos.row}"][data-col="${data.selectedCellPos.col}"]`); 
                    if (targetCell) selectCell(targetCell); 
                } 
            } catch (e) { 
                console.error("Error al aplicar estado:", e); 
            } 
        }

        function undoState() { 
            if (undoStack.length > 1) { 
                undoStack.pop(); 
                const previousState = undoStack[undoStack.length - 1]; 
                applySnapshot(previousState); 
                localStorage.setItem('sheetData_v9', previousState); 
            } 
        }

        function saveState() { 
            const snapshot = getCurrentSnapshot(); 
            if (undoStack.length === 0 || undoStack[undoStack.length - 1] !== snapshot) { 
                undoStack.push(snapshot); 
                if (undoStack.length > maxUndoSteps) undoStack.shift(); 
            } 
            localStorage.setItem('sheetData_v9', snapshot); 
        }

        function loadState() { 
            const saved = localStorage.getItem('sheetData_v9'); 
            if (!saved) return; 
            applySnapshot(saved); 
            undoStack.push(saved); 
        }

        /* EXPORTAR PDF CON ESTADO CODIFICADO EN BASE64 */
        function exportToPDF() { 
            if (selectedCell) selectedCell.classList.remove('selected'); 
            clearSelectionStyles(); 
            
            const paperElement = document.getElementById('sheetPaper');
            const titleText = document.querySelector('.sheet-title').textContent; 

            const formattedTitle = titleText.trim()
                .toLowerCase()
                .split(/\s+/)
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');

            const fileName = formattedTitle || 'Gorrion';

            html2canvas(paperElement, { 
                scale: 2, 
                backgroundColor: '#000000', 
                useCORS: true, 
                logging: false 
            }).then(canvas => { 
                const imgData = canvas.toDataURL('image/jpeg', 0.85);
                const { jsPDF } = window.jspdf;
                
                const pdf = new jsPDF({ 
                    orientation: 'landscape', 
                    unit: 'mm', 
                    format: 'a4',
                    compress: true 
                }); 

                const currentStateStr = getCurrentSnapshot();
                
                const encodedData = btoa(unescape(encodeURIComponent(currentStateStr)));

                pdf.setProperties({
                    title: titleText,
                    subject: encodedData
                });

                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = pdf.internal.pageSize.getHeight();

                const imgWidth = canvas.width;
                const imgHeight = canvas.height;
                const ratio = Math.min(pdfWidth / imgWidth, pdfHeight / imgHeight);

                const renderWidth = imgWidth * ratio;
                const renderHeight = imgHeight * ratio;

                const xOffset = (pdfWidth - renderWidth) / 2;
                const yOffset = (pdfHeight - renderHeight) / 2;

                pdf.addImage(imgData, 'JPEG', xOffset, yOffset, renderWidth, renderHeight); 
                
                pdf.save(`${fileName}.pdf`); 

                if (selectedCell) selectCell(selectedCell); 
            }); 
        }

        /* IMPORTAR PDF DECODIFICANDO BASE64 */
        async function importPDFWithMetadata(event) {
            const file = event.target.files[0];
            if (!file) return;

            try {
                const arrayBuffer = await file.arrayBuffer();
                const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                const pdf = await loadingTask.promise;

                let loadedState = null;

                const metadata = await pdf.getMetadata();
                
                if (metadata && metadata.info && metadata.info.Subject) {
                    try {
                        const decodedStr = decodeURIComponent(escape(atob(metadata.info.Subject)));
                        loadedState = JSON.parse(decodedStr);
                    } catch(e) {
                        console.warn("No se pudo decodificar Subject, probando alternativa...");
                    }
                }

                if (!loadedState && metadata && metadata.info && metadata.info.Keywords) {
                    try {
                        loadedState = JSON.parse(metadata.info.Keywords);
                    } catch(e) {}
                }

                if (loadedState) {
                    applySnapshot(loadedState);
                    saveState();
                    alert(`Partitura "${loadedState.title || 'Cargada'}" importada con éxito.`);
                } else {
                    alert("Este PDF no contiene datos editables válidos.");
                }
            } catch (error) {
                console.error("Error al cargar PDF:", error);
                alert("Ocurrió un error al procesar el PDF.");
            }
            event.target.value = "";
        }

        loadState();
        const firstCell = document.querySelector('.cell[data-row="0"][data-col="0"]');
        if (firstCell && !selectedCell) selectCell(firstCell);

        function handleDeleteButton() {
            if (!selectedCell) return;
            if (selectedCellsList.length > 1) {
                clearSelectedRange();
                return;
            }
            let currentRow = parseInt(selectedCell.dataset.row), currentCol = parseInt(selectedCell.dataset.col);
            if (selectedCell.innerHTML === '') { 
                if (currentCol > 0) { 
                    currentCol--; 
                    const target = document.querySelector(`.cell[data-row="${currentRow}"][data-col="${currentCol}"]`); 
                    if (target) { 
                        selectCell(target); 
                        clearCell(); 
                    } 
                } 
            } else { 
                clearCell(); 
            }
            clearSelectionStyles();
            if (selectedCell) selectCell(selectedCell);
            saveState();
        }
        function applyRedToSelected() {
    if (!selectedCell) return;

    const applyRed = (cell) => {
        // Verificar si la celda tiene contenido (texto o elementos SVG/HTML)
        const hasContent = cell.textContent.trim() !== '' || cell.children.length > 0;
        
        // Solo aplica rojo SI LA CELDA TIENE ALGO ADENTRO
        if (hasContent) {
            cell.style.color = "#FF0000";
            const svgs = cell.querySelectorAll('svg *');
            svgs.forEach(el => {
                if (el.getAttribute('fill') && el.getAttribute('fill') !== 'none') el.style.fill = "#FF0000";
                if (el.getAttribute('stroke') && el.getAttribute('stroke') !== 'none') el.style.stroke = "#FF0000";
            });
        }
    };

    if (typeof selectedCellsList !== 'undefined' && selectedCellsList.length > 1) {
        selectedCellsList.forEach(cell => applyRed(cell));
    } else {
        applyRed(selectedCell);
    }

    if (typeof saveState === 'function') saveState();
}
